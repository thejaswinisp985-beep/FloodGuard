name: flood_demo
description: "Flood Risk Prediction App with beautiful water theme."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  http: ^1.2.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  geolocator: ^13.0.1
  mailer: ^6.1.0
  url_launcher: 6.0.20

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/enhanced_flood_model.tflite
    - assets/flood_model.tflite

